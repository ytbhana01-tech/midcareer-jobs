name: Update public job listings
on:
  workflow_dispatch:
  schedule:
    - cron: "17 1,7 * * *"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect public ALIO listings
        env:
          ALIO_API_KEY: ${{ secrets.ALIO_API_KEY }}
        run: python collect.py
      - name: Commit listing feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh ALIO public job feed"
            git push
          fi
