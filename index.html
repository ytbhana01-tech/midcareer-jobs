<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중장년 채용정보</title><style>body{font:16px system-ui,'Malgun Gothic',sans-serif;margin:0;background:#f5f7fb;color:#243247}header{background:#fff;padding:22px max(22px,calc((100% - 980px)/2));font-weight:800;font-size:23px;color:#164d8a}main{max-width:980px;margin:auto;padding:24px}h1{font-size:30px}p{line-height:1.7;color:#617186}.ad{background:#edf0f4;border:1px dashed #a8b3c1;padding:28px;text-align:center;margin:25px 0;border-radius:12px;color:#748294}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}input,select{padding:12px;border:1px solid #ccd4df;border-radius:8px;font:inherit;flex:1;min-width:180px}.job{background:white;border:1px solid #e3e8ef;border-radius:12px;padding:20px;margin:12px 0}.job h2{font-size:19px;margin:8px 0}.small{font-size:13px;color:#6b7a8d}a{color:#175b9c}footer{padding:30px 0;color:#778497;font-size:13px}</style></head><body><header>중장년 채용정보</header><main><h1>공공기관 채용정보를 한눈에</h1><p>공무직·무기계약직 등 채용정보를 찾아보세요. 지원 전 자격과 마감일은 반드시 공식 공고에서 확인해야 합니다.</p><div class="ad">광고 영역 · 서비스 준비 중</div><div class="filters"><input id="q" placeholder="기관명·공고명 검색"><select id="region"><option value="">전국 지역</option><option>서울</option><option>경기</option><option>부산</option><option>경남</option><option>대구</option><option>인천</option></select></div><h2>채용공고 <span id="count">0</span>건</h2><div id="cards"><p>공공데이터 연결을 준비하고 있습니다.</p></div><div class="ad">광고 영역 · 하단</div><footer>정보 출처: 공공기관 경영정보 공개시스템 ALIO. 지원 전 공식 공고문을 확인하세요.</footer></main><script>
let jobs=[];const q=document.getElementById('q'),r=document.getElementById('region'),cards=document.getElementById('cards'),count=document.getElementById('count');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const text=q.value.trim().toLowerCase();const filtered=jobs.filter(j=>(!text||[j.title,j.org,j.region].join(' ').toLowerCase().includes(text))&&(!r.value||j.region.includes(r.value)));count.textContent=filtered.length;cards.innerHTML=filtered.length?filtered.map(j=>'<article class="job"><div class="small">'+esc(j.org)+' · '+esc(j.region)+'</div><h2>'+esc(j.title)+'</h2><div class="small">고용형태: '+esc(j.type)+' · 접수 마감: '+esc(j.deadline)+'</div><p><a href="https://job.alio.go.kr/recruit.do" target="_blank" rel="noopener noreferrer">JOB-ALIO에서 공고 확인하기</a></p></article>').join(''):'<p>현재 표시할 공고가 없습니다.</p>'}q.addEventListener('input',render);r.addEventListener('change',render);fetch('./jobs.json',{cache:'no-store'}).then(x=>{if(!x.ok)throw Error();return x.json()}).then(x=>{if(Array.isArray(x.jobs)){jobs=x.jobs;render()}}).catch(()=>{});
</script></body></html>
